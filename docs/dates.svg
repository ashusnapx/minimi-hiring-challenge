<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" viewBox="0 0 1280 440"><rect width="1280" height="440" fill="#f7f5f1" rx="28"/><text x="56" y="92" fill="#1c1a17" font-size="30" font-weight="700">“Last Tuesday I asked you…”</text><text x="56" y="126" fill="#6f6a61" font-size="18">said on Wednesday 11 November 2026</text><g fill="#1c1a17" font-size="19"><circle cx="70" cy="190" r="14" fill="#1c1a17"/><text x="64" y="196" fill="#f7f5f1" font-size="15" font-weight="700">1</text><text x="98" y="196">Two honest readings: <tspan font-weight="700">10 Nov</tspan> or <tspan font-weight="700">3 Nov</tspan></text><circle cx="70" cy="244" r="14" fill="#1c1a17"/><text x="64" y="250" fill="#f7f5f1" font-size="15" font-weight="700">2</text><text x="98" y="250">Memory checks which day has a chat</text><circle cx="70" cy="298" r="14" fill="#1c1a17"/><text x="64" y="304" fill="#f7f5f1" font-size="15" font-weight="700">3</text><text x="98" y="304">Model is told: assume <tspan fill="#b7791f" font-weight="700">Tue 3 Nov</tspan>, and say so</text></g><text x="56" y="370" fill="#8a847a" font-size="15">Date maths runs in code (chrono-node), never in the model.</text><g fill="#a39d92" font-size="13" font-weight="600"><text x="666" y="74">MON</text><text x="750" y="74">TUE</text><text x="834" y="74">WED</text><text x="918" y="74">THU</text><text x="1002" y="74">FRI</text><text x="1086" y="74">SAT</text><text x="1170" y="74">SUN</text></g><g fill="#1c1a17" font-size="17"><rect width="80" height="96" x="652" y="92" fill="#fffefb" stroke="#e8e3da" rx="12"/><text x="666" y="118">2</text><rect width="80" height="96" x="736" y="92" fill="#fdf3df" stroke="#b7791f" stroke-width="2.5" rx="12"/><text x="750" y="118" font-weight="700">3</text><text x="750" y="150" fill="#b7791f" font-size="12" font-weight="700">1 chat ✓</text><text x="750" y="170" fill="#b7791f" font-size="12">Postgres</text><rect width="80" h