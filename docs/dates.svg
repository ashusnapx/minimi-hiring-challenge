<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <rect width="1280" height="440" rx="28" fill="#f7f5f1"/>

  <text x="56" y="92" font-size="30" font-weight="700" fill="#1c1a17">“Last Tuesday I asked you…”</text>
  <text x="56" y="126" font-size="18" fill="#6f6a61">said on Wednesday 11 November 2026</text>
  <g font-size="19" fill="#1c1a17">
    <circle cx="70" cy="190" r="14" fill="#1c1a17"/><text x="64" y="196" font-size="15" font-weight="700" fill="#f7f5f1">1</text>
    <text x="98" y="196">Two honest readings: <tspan font-weight="700">10 Nov</tspan> or <tspan font-weight="700">3 Nov</tspan></text>
    <circle cx="70" cy="244" r="14" fill="#1c1a17"/><text x="64" y="250" font-size="15" font-weight="700" fill="#f7f5f1">2</text>
    <text x="98" y="250">Memory checks which day has a chat</text>
    <circle cx="70" cy="298" r="14" fill="#1c1a17"/><text x="64" y="304" font-size="15" font-weight="700" fill="#f7f5f1">3</text>
    <text x="98" y="304">Model is told: assume <tspan font-weight="700" fill="#b7791f">Tue 3 Nov</tspan>, and say so</text>
  </g>
  <text x="56" y="370" font-size="15" fill="#8a847a">Date maths runs in code (chrono-node), never in the model.</text>

  <!-- calendar -->
  <g font-size="13" font-weight="600" fill="#a39d92">
    <text x="666" y="74">MON</text><text x="750" y="74">TUE</text><text x="834" y="74">WED</text><text x="918" y="74">THU</text><text x="1002" y="74">FRI</text><text x="1086" y="74">SAT</text><text x="1170" y="74">SUN</text>
  </g>
  <g font-size="17" fill="#1c1a17">
    <!-- week of 2 Nov -->
    <rect x="652" y="92" width="80" height="96" rx="12" fill="#fffefb" stroke="#e8e3da"/><text x="666" y="118">2</text>
    <rect x="736" y="92" width="80" height="96" rx="12" fill="#fdf3df" stroke="#b7791f" stroke-width="2.5"/><text x="750" y="118" font-weight="700">3</text>
    <text x="750" y="150" font-size="12" font-weight="700" fill="#b7791f">1 chat ✓</text><text x="750" y="170" font-size="12" fill="#b7791f">Postgres</text>
    <rect x="820" y="92" width="80" height="96" rx="12" fill="#fffefb" stroke="#e8e3da"/><text x="834" y="118">4</text>
    <rect x="904" y="92" width="80" height="96" rx="12" fill="#fffefb" stroke="#e8e3da"/><text x="918" y="118">5</text>
    <rect x="988" y="92" width="80" height="96" rx="12" fill="#fffefb" stroke="#e8e3da"/><text x="1002" y="118">6</text>
    <rect x="1072" y="92" width="80" height="96" rx="12" fill="#fffefb" stroke="#e8e3da"/><text x="1086" y="118">7</text>
    <rect x="1156" y="92" width="80" height="96" rx="12" fill="#fffefb" stroke="#e8e3da"/><text x="1170" y="118">8</text>
    <!-- week of 9 Nov -->
    <rect x="652" y="196" width="80" height="96" rx="12" fill="#fffefb" stroke="#e8e3da"/><text x="666" y="222">9</text>
    <circle cx="670" cy="250" r="3.5" fill="#3d5a80"/><text x="680" y="255" font-size="12" fill="#3d5a80">CRM</text>
    <rect x="736" y="196" width="80" height="96" rx="12" fill="#fffefb" stroke="#a39d92" stroke-width="2" stroke-dasharray="5 4"/><text x="750" y="222">10</text>
    <text x="750" y="254" font-size="12" fill="#8a847a">no chats</text>
    <rect x="820" y="196" width="80" height="96" rx="12" fill="#1c1a17"/><text x="834" y="222" fill="#f4f1ea" font-weight="700">11</text>
    <text x="834" y="254" font-size="12" fill="#f2b33d" font-weight="700">today</text>
    <g opacity=".4">
      <rect x="904" y="196" width="80" height="96" rx="12" fill="#fffefb" stroke="#e8e3da"/><text x="918" y="222">12</text>
      <rect x="988" y="196" width="80" height="96" rx="12" fill="#fffefb" stroke="#e8e3da"/><text x="1002" y="222">13</text>
      <rect x="1072" y="196" width="80" height="96" rx="12" fill="#fffefb" stroke="#e8e3da"/><text x="1086" y="222">14</text>
      <rect x="1156" y="196" width="80" height="96" rx="12" fill="#fffefb" stroke="#e8e3da"/><text x="1170" y="222">15</text>
    </g>
  </g>
  <!-- candidate markers -->
  <path d="M776 300 v18" stroke="#a39d92" stroke-width="2"/>
  <text x="702" y="342" font-size="14" fill="#8a847a">10 Nov · nothing stored</text>
  <text x="652" y="384" font-size="15" font-weight="700" fill="#b7791f">→ 3 Nov wins: the only Tuesday with a conversation</text>
</svg>
