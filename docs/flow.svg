<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a847a"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b7791f"/></marker>
  </defs>
  <rect width="1280" height="600" rx="28" fill="#f7f5f1"/>

  <text x="48" y="58" font-size="26" font-weight="700" fill="#1c1a17">One message, end to end</text>
  <text x="48" y="86" font-size="16" fill="#6f6a61">Steps 1–3 are plain code: memory adds no model call before the first word.</text>

  <!-- bracket over code-only steps -->
  <path d="M48 120 v-8 h692 v8" fill="none" stroke="#b7791f" stroke-width="2"/>
  <text x="300" y="106" font-size="14" font-weight="600" fill="#b7791f">code only · ~1 ms · 0 model calls</text>

  <!-- row 1 -->
  <g font-size="15">
    <rect x="48" y="130" width="200" height="150" rx="16" fill="#fffefb" stroke="#e8e3da" stroke-width="1.5"/>
    <text x="68" y="162" font-size="18" font-weight="700" fill="#1c1a17">1 · Dates</text>
    <text x="68" y="184" font-size="13" fill="#a39d92">dates.ts</text>
    <text x="68" y="218" fill="#1c1a17">“last Tuesday”</text>
    <text x="68" y="240" fill="#b7791f" font-weight="600">→ 10 Nov | 3 Nov</text>
    <text x="68" y="266" font-size="13" fill="#8a847a">chrono-node + your timezone</text>

    <rect x="294" y="130" width="200" height="150" rx="16" fill="#fdf3df" stroke="#e9c27a" stroke-width="1.5"/>
    <text x="314" y="162" font-size="18" font-weight="700" fill="#1c1a17">2 · Recall</text>
    <text x="314" y="184" font-size="13" fill="#a39d92">memory.ts</text>
    <text x="314" y="218" fill="#1c1a17">past chats by day</text>
    <text x="314" y="240" fill="#1c1a17">+ topic overlap</text>
    <text x="314" y="266" font-size="13" fill="#8a847a">says “NO record” out loud</text>

    <rect x="540" y="130" width="200" height="150" rx="16" fill="#fffefb" stroke="#e8e3da" stroke-width="1.5"/>
    <text x="560" y="162" font-size="18" font-weight="700" fill="#1c1a17">3 · Prompt</text>
    <text x="560" y="184" font-size="13" fill="#a39d92">prompt.ts</text>
    <text x="560" y="218" fill="#1c1a17">today + timezone</text>
    <text x="560" y="240" fill="#1c1a17">+ &lt;memory&gt; block</text>
    <text x="560" y="266" font-size="13" fill="#8a847a">facts then, with dates</text>

    <rect x="786" y="130" width="200" height="150" rx="16" fill="#1c1a17"/>
    <text x="806" y="162" font-size="18" font-weight="700" fill="#f4f1ea">4 · Agent loop</text>
    <text x="806" y="184" font-size="13" fill="#8a847a">agent.ts</text>
    <text x="806" y="218" fill="#f4f1ea">Sonnet 5.5 · low effort</text>
    <text x="806" y="240" fill="#f2b33d" font-weight="600">⇄ web_search × N</text>
    <text x="806" y="266" font-size="13" fill="#a39d92">parallel · ≤ 5 rounds</text>

    <rect x="1032" y="130" width="200" height="150" rx="16" fill="#fffefb" stroke="#e8e3da" stroke-width="1.5"/>
    <text x="1052" y="162" font-size="18" font-weight="700" fill="#1c1a17">5 · Stream</text>
    <text x="1052" y="184" font-size="13" fill="#a39d92">server.ts · SSE</text>
    <text x="1052" y="218" fill="#1c1a17">words as they come</text>
    <text x="1052" y="240" fill="#1c1a17">+ status + sources</text>
    <text x="1052" y="266" font-size="13" fill="#8a847a">cited as [n]</text>
  </g>
  <g stroke="#8a847a" stroke-width="2" marker-end="url(#a)">
    <line x1="250" y1="205" x2="290" y2="205"/>
    <line x1="496" y1="205" x2="536" y2="205"/>
    <line x1="742" y1="205" x2="782" y2="205"/>
    <line x1="988" y1="205" x2="1028" y2="205"/>
  </g>

  <!-- exa -->
  <line x1="886" y1="284" x2="886" y2="318" stroke="#8a847a" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="786" y="322" width="200" height="66" rx="14" fill="#e9eff6" stroke="#b9cbe2" stroke-width="1.5"/>
  <text x="806" y="350" font-size="16" font-weight="700" fill="#3d5a80">Exa search</text>
  <text x="806" y="372" font-size="13" fill="#3d5a80">published_after · live pages</text>

  <!-- row 2: after the reply -->
  <text x="48" y="456" font-size="18" font-weight="700" fill="#1c1a17">After the reply</text>
  <text x="48" y="480" font-size="14" fill="#6f6a61">off the critical path,</text>
  <text x="48" y="500" font-size="14" fill="#6f6a61">never slows an answer</text>

  <g font-size="15">
    <rect x="1032" y="430" width="200" height="96" rx="16" fill="#fffefb" stroke="#c9c3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="1052" y="462" font-size="18" font-weight="700" fill="#1c1a17">6 · Save turn</text>
    <text x="1052" y="486" fill="#1c1a17">store.ts</text>
    <text x="1052" y="508" font-size="13" fill="#8a847a">atomic JSON write</text>

    <rect x="786" y="430" width="200" height="96" rx="16" fill="#fffefb" stroke="#c9c3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="806" y="462" font-size="18" font-weight="700" fill="#1c1a17">7 · Remember</text>
    <text x="806" y="486" fill="#1c1a17">remember.ts · Haiku 5.5</text>
    <text x="806" y="508" font-size="13" fill="#8a847a">one structured call</text>

    <rect x="540" y="430" width="200" height="96" rx="16" fill="#fdf3df" stroke="#e9c27a" stroke-width="1.5"/>
    <text x="560" y="462" font-size="18" font-weight="700" fill="#1c1a17">Memory ledger</text>
    <text x="560" y="486" font-size="14" fill="#1c1a17">claims · profile facts</text>
    <text x="560" y="508" font-size="14" fill="#1c1a17">open loops · decisions</text>
  </g>
  <g stroke="#8a847a" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="1132" y1="284" x2="1132" y2="426"/>
    <line x1="1030" y1="478" x2="990" y2="478"/>
    <line x1="784" y1="478" x2="744" y2="478"/>
  </g>
  <path d="M538 478 H394 V286" fill="none" stroke="#b7791f" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#g)"/>
  <text x="406" y="560" font-size="14" font-weight="600" fill="#b7791f">next turn: no re-briefing · then vs now · pings · /mcp</text>
</svg>
