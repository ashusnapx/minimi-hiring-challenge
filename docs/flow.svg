<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" viewBox="0 0 1280 600"><defs><marker id="a" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#8a847a" d="M0 0L10 5L0 10z"/></marker><marker id="g" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#b7791f" d="M0 0L10 5L0 10z"/></marker></defs><rect width="1280" height="600" fill="#f7f5f1" rx="28"/><text x="48" y="58" fill="#1c1a17" font-size="26" font-weight="700">One message, end to end</text><text x="48" y="86" fill="#6f6a61" font-size="16">Steps 1–3 are plain code: memory adds no model call before the first word.</text><path fill="none" stroke="#b7791f" stroke-width="2" d="M48 120 v-8 h692 v8"/><text x="300" y="106" fill="#b7791f" font-size="14" font-weight="600">code only · ~1 ms · 0 model calls</text><g font-size="15"><rect width="200" height="150" x="48" y="130" fill="#fffefb" stroke="#e8e3da" stroke-width="1.5" rx="16"/><text x="68" y="162" fill="#1c1a17" font-size="18" font-weight="700">1 · Dates</text><text x="68" y="184" fill="#a39d92" font-size="13">dates.ts</text><text x="68" y="218" fill="#1c1a17">“last Tuesday”</text><text x="68" y="240" fill="#b7791f" font-weight="600">→ 10 Nov | 3 Nov</text><text x="68" y="266" fill="#8a847a" font-size="13">chrono-node + your timezone</text><rect width="200" height="150" x="294" y="130" fill="#fdf3df" stroke="#e9c27a" stroke-width="1.5" rx="16"/><text x="314" y="162" fill="#1c1a17" font-size="18" font-weight="700">2 · Recall</text><text x="314" y="184" fill="#a39d92" font-size="13">memory.ts</text><text x="314" y="218" fill="#1c1a17">past chats by day</text><text x="314" y="240" fill="#1c1a17">+ topic overlap</text><text x="314" y="266" fill="#8a847a" font-size="13">says “NO record” out loud</text><rect width="200" height="150" x="540" y="130" fill="#fffefb" stroke="#e8e3da" stroke-width="1.5" rx="16"/><text x="560" y="162" fill="#1c1a17" font-size="18" font-weight="700">3 · Prompt</text><text x="560" y="184" fill="#a39d92" font-size="13">prompt.ts</text><text x="560" y="218" fill="#1c1a17">today + timezone</text><text x="560" y="240" fill="#1c1a17">+ &lt;memory&gt; block</text><text x="560" y="266" fill="#8a847a" font-size="13">facts then, with dates</text><rect width="200" height="150" x="786" y="130" fill="#1c1a17" rx="16"/><text x="806" y="162" fill="#f4f1ea" font-size="18" font-weight="700">4 · Agent loop</text><text x="806" y="184" fill="#8a847a" font-size="13">agent.ts</text><text x="806" y="218" fill="#f4f1ea">Sonnet 5.5 · low effort</text><text x="806" y="240" fill="#f2b33d" font-weight="600">⇄ web_search × N</text><text x="806" y="266" fill="#a39d92" font-size="13">parallel · ≤ 5 rounds</text><rect width="200" height="150" x="1032" y="130" fill="#fffefb" stroke="#e8e3da" stroke-width="1.5" rx="16"/><text x="1052" y="162" fill="#1c1a17" font-size="18" font-weight="700">5 · Stream</text><text x="1052" y="184" fill="#a39d92" font-size="13">server.ts · SSE</text><text x="1052" y="218" fill="#1c1a17">words as they come</text><text x="1052" y="240" fill="#1c1a17">+ status + sources</text><text x="1052" y="266" fill="#8a847a" font-size="13">cited as [n]</text></g><g stroke="#8a847a" stroke-width="2" marker-end="url(#a)"><line x1="250" x2="290" y1="205" y2="205"/><line x1="496" x2="536" y1="205" y2="205"/><line x1="742" x2="782" y1="205" y2="205"/><line x1="988" x2="1028" y1="205" y2="205"/></g><line x1="886" x2="886" y1="284" y2="318" stroke="#8a847a" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><rect width="200" height="66" x="786" y="322" fill="#e9eff6" stroke="#b9cbe2" stroke-width="1.5" rx="14"/><text x="806" y="350" fill="#3d5a80" font-size="16" font-weight="700">Exa search</text><text x="806" y="372" fill="#3d5a80" font-size="13">published_after · live pages</text><text x="48" y="456" fill="#1c1a17" font-size="18" font-weight="700">After the reply</text><text x="48" y="480" fill="#6f6a61" font-size="14">off the critical path,</text><text x="48" y="500" fill="#6f6a61" font-size="14">never slows an answer</text><g font-size="15"><rect width="200" height="96" x="1032" y="430" fill="#fffefb" stroke="#c9c3b8" stroke-dasharray="6 5" stroke-width="1.5" rx="16"/><text x="1052" y="462" fill="#1c1a17" font-size="18" font-weight="700">6 · Save turn</text><text x="1052" y="486" fill="#1c1a17">store.ts</text><text x="1052" y="508" fill="#8a847a" font-size="13">atomic JSON write</text><rect width="200" height="96" x="786" y="430" fill="#fffefb" stroke="#c9c3b8" stroke-dasharray="6 5" stroke-width="1.5" rx="16"/><text x="806" y="462" fill="#1c1a17" font-size="18" font-weight="700">7 · Remember</text><text x="806" y="486" fill="#1c1a17">remember.ts · Haiku 5.5</text><text x="806" y="508" fill="#8a847a" font-size="13">one structured call</text><rect width="200" height="96" x="540" y="430" fill="#fdf3df" stroke="#e9c27a" stroke-width="1.5" rx="16"/><text x="560" y="462" fill="#1c1a17" font-size="18" font-weight="700">Memory ledger</text><text x="560" y="486" fill="#1c1a17" font-size="14">claims · profile facts</text><text x="560" y="508" fill="#1c1a17" font-size="14">open loops · decisions</text></g><g fill="none" stroke="#8a847a" stroke-width="2" marker-end="url(#a)"><line x1="1132" x2="1132" y1="284" y2="426"/><line x1="1030" x2="990" y1="478" y2="478"/><line x1="784" x2="744" y1="478" y2="478"/></g><path fill="none" stroke="#b7791f" stroke-dasharray="7 6" stroke-width="2.5" marker-end="url(#g)" d="M538 478 H394 V286"/><text x="406" y="560" fill="#b7791f" font-size="14" font-weight="600">next turn: no re-briefing · then vs now · pings · /mcp</text></svg>