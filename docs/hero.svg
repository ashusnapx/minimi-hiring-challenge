<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22201c"/>
      <stop offset="1" stop-color="#121110"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1280" height="600" rx="28" fill="url(#bg)"/>
  <circle cx="1130" cy="90" r="260" fill="#f2b33d" opacity=".05"/>

  <!-- left: identity -->
  <rect x="72" y="140" width="64" height="64" rx="18" fill="#2c2a25"/>
  <circle cx="104" cy="172" r="14" fill="none" stroke="#f2b33d" stroke-width="6"/>
  <text x="156" y="192" font-size="58" font-weight="700" letter-spacing="-2" fill="#f4f1ea">minimi</text>
  <text x="72" y="282" font-size="40" font-weight="700" letter-spacing="-1" fill="#f4f1ea">Remembers what it told you.</text>
  <text x="72" y="332" font-size="40" font-weight="700" letter-spacing="-1" fill="#f2b33d">Checks if it’s still true.</text>
  <text x="72" y="388" font-size="19" fill="#9b958a">A chat agent with one tool, web search, and a dated</text>
  <text x="72" y="416" font-size="19" fill="#9b958a">memory of every conversation it has ever had with you.</text>

  <g font-size="15" font-weight="600">
    <rect x="72" y="456" width="150" height="36" rx="18" fill="#3a2f17"/><text x="94" y="479" fill="#f2b33d">dated memory</text>
    <rect x="234" y="456" width="168" height="36" rx="18" fill="#1f2a38"/><text x="256" y="479" fill="#9db7da">then-vs-now diffs</text>
    <rect x="414" y="456" width="164" height="36" rx="18" fill="#2a2824"/><text x="436" y="479" fill="#d6d1c7">live web search</text>
  </g>
  <text x="72" y="540" font-size="14" fill="#6f6a61">TypeScript · Node · Claude Sonnet 5.5 + Haiku 5.5 · Exa</text>

  <!-- right: product mock -->
  <g filter="url(#shadow)">
    <rect x="690" y="58" width="520" height="484" rx="22" fill="#fffefb"/>
  </g>
  <rect x="852" y="86" width="330" height="62" rx="18" fill="#1c1a17"/>
  <text x="872" y="112" font-size="16" fill="#fbfaf7">What did I ask you on 3 November?</text>
  <text x="872" y="134" font-size="16" fill="#fbfaf7">Is your answer still correct?</text>

  <rect x="718" y="168" width="318" height="30" rx="15" fill="#fdf3df"/>
  <circle cx="734" cy="183" r="3.5" fill="#b7791f"/>
  <text x="746" y="188" font-size="14" fill="#b7791f">Remembered Tue 3 Nov · Postgres hosting</text>
  <rect x="718" y="206" width="352" height="30" rx="15" fill="#e9eff6"/>
  <circle cx="734" cy="221" r="3.5" fill="#3d5a80"/>
  <text x="746" y="226" font-size="14" fill="#3d5a80">Searching: managed Postgres pricing (live)</text>

  <text x="718" y="276" font-size="16" fill="#1c1a17">On Tue 3 Nov you asked for the cheapest managed</text>
  <text x="718" y="300" font-size="16" fill="#1c1a17">Postgres host. Mostly still right, one price moved:</text>

  <g font-size="14">
    <text x="718" y="342" fill="#8a847a" font-weight="600">Plan</text>
    <text x="940" y="342" fill="#8a847a" font-weight="600">3 Nov</text>
    <text x="1050" y="342" fill="#8a847a" font-weight="600">Today</text>
    <line x1="718" y1="354" x2="1182" y2="354" stroke="#e8e3da"/>
    <text x="718" y="382" fill="#1c1a17">Host A · Starter</text><text x="940" y="382" fill="#1c1a17">$19/mo</text><text x="1050" y="382" fill="#2f7d4f" font-weight="600">$19 ✓ same</text>
    <line x1="718" y1="396" x2="1182" y2="396" stroke="#efebe4"/>
    <text x="718" y="424" fill="#1c1a17">Host B · Pro</text><text x="940" y="424" fill="#1c1a17">$25/mo</text><text x="1050" y="424" fill="#b4442e" font-weight="600">$29 ↑ changed</text>
    <line x1="718" y1="438" x2="1182" y2="438" stroke="#efebe4"/>
    <text x="718" y="466" fill="#1c1a17">Host C · Basic</text><text x="940" y="466" fill="#1c1a17">$15/mo</text><text x="1050" y="466" fill="#2f7d4f" font-weight="600">$15 ✓ same</text>
  </g>
  <g font-size="12" fill="#3d5a80">
    <rect x="718" y="494" width="150" height="26" rx="8" fill="#e9eff6"/><text x="730" y="511">1 · hosta.com/pricing</text>
    <rect x="878" y="494" width="150" height="26" rx="8" fill="#e9eff6"/><text x="890" y="511">2 · hostb.com/pricing</text>
    <text x="1040" y="511" fill="#a39d92">illustrative data</text>
  </g>
</svg>
