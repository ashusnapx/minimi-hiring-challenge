<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" viewBox="0 0 1280 600"><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#22201c"/><stop offset="1" stop-color="#121110"/></linearGradient><filter id="shadow" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="18" flood-color="#000" flood-opacity=".45" stdDeviation="22"/></filter></defs><rect width="1280" height="600" fill="url(#bg)" rx="28"/><circle cx="1130" cy="90" r="260" fill="#f2b33d" opacity=".05"/><rect width="64" height="64" x="72" y="140" fill="#2c2a25" rx="18"/><circle cx="104" cy="172" r="14" fill="none" stroke="#f2b33d" stroke-width="6"/><text x="156" y="192" fill="#f4f1ea" font-size="58" font-weight="700" letter-spacing="-2">minimi</text><text x="72" y="282" fill="#f4f1ea" font-size="40" font-weight="700" letter-spacing="-1">Remembers what it told you.</text><text x="72" y="332" fill="#f2b33d" font-size="40" font-weight="700" letter-spacing="-1">Checks if it’s still true.</text><text x="72" y="388" fill="#9b958a" font-size="19">A chat agent with one tool, web search, and a dated</text><text x="72" y="416" fill="#9b958a" font-size="19">memory of every conversation it has ever had with you.</text><g font-size="15" font-weight="600"><rect width="150" height="36" x="72" y="456" fill="#3a2f17" rx="18"/><text x="94" y="479" fill="#f2b33d">dated memory</text><rect width="168" height="36" x="234" y="456" fill="#1f2a38" rx="18"/><text x="256" y="479" fill="#9db7da">then-vs-now diffs</text><rect width="164" height="36" x="414" y="456" fill="#2a2824" rx="18"/><text x="436" y="479" fill="#d6d1c7">live web search</text></g><text x="72" y="540" fill="#6f6a61" font-size="14">TypeScript · Node · Claude Sonnet 5.5 + Haiku 5.5 · Exa</text><g filter="url(#shadow)"><rect width="520" height="484" x="690" y="58" fill="#fffefb" rx="22"/></g><rect width="330" height="62" x="852" y="86" fill="#1c1a17" rx="18"/><text x="872" y="112" fill="#fbfaf7" font-size="16">What did I ask you on 3 November?</text><text x="872" y="134" fill="#fbfaf7" font-size="16">Is your answer still correct?</text><rect width="318" height="30" x="718" y="168" fill="#fdf3df" rx="15"/><circle cx="734" cy="183" r="3.5" fill="#b7791f"/><text x="746" y="188" fill="#b7791f" font-size="14">Remembered Tue 3 Nov · Postgres hosting</text><rect width="352" height="30" x="718" y="206" fill="#e9eff6" rx="15"/><circle cx="734" cy="221" r="3.5" fill="#3d5a80"/><text x="746" y="226" fill="#3d5a80" font-size="14">Searching: managed Postgres pricing (live)</text><text x="718" y="276" fill="#1c1a17" font-size="16">On Tue 3 Nov you asked for the cheapest managed</text><text x="718" y="300" fill="#1c1a17" font-size="16">Postgres host. Mostly still right, one price moved:</text><g font-size="14"><text x="718" y="342" fill="#8a847a" font-weight="600">Plan</text><text x="940" y="342" fill="#8a847a" font-weight="600">3 Nov</text><text x="1050" y="342" fill="#8a847a" font-weight="600">Today</text><line x1="718" x2="1182" y1="354" y2="354" stroke="#e8e3da"/><text x="718" y="382" fill="#1c1a17">Host A · Starter</text><text x="940" y="382" fill="#1c1a17">$19/mo</text><text x="1050" y="382" fill="#2f7d4f" font-weight="600">$19 ✓ same</text><line x1="718" x2="1182" y1="396" y2="396" stroke="#efebe4"/><text x="718" y="424" fill="#1c1a17">Host B · Pro</text><text x="940" y="424" fill="#1c1a17">$25/mo</text><text x="1050" y="424" fill="#b4442e" font-weight="600">$29 ↑ changed</text><line x1="718" x2="1182" y1="438" y2="438" stroke="#efebe4"/><text x="718" y="466" fill="#1c1a17">Host C · Basic</text><text x="940" y="466" fill="#1c1a17">$15/mo</text><text x="1050" y="466" fill="#2f7d4f" font-weight="600">$15 ✓ same</text></g><g fill="#3d5a80" font-size="12"><rect width="150" height="26" x="718" y="494" fill="#e9eff6" rx="8"/><text x="730" y="511">1 · hosta.com/pricing</text><rect width="150" height="26" x