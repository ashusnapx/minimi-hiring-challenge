<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1c1a17"/></marker>
  </defs>
  <rect width="1280" height="420" rx="28" fill="#f7f5f1"/>
  <text x="56" y="62" font-size="26" font-weight="700" fill="#1c1a17">Then vs now</text>
  <text x="56" y="90" font-size="16" fill="#6f6a61">Every answer files its checkable facts. A later “has it changed?” re-checks exactly those.</text>

  <!-- then -->
  <rect x="56" y="122" width="430" height="236" rx="18" fill="#fffefb" stroke="#e8e3da" stroke-width="1.5"/>
  <text x="80" y="158" font-size="14" font-weight="700" fill="#b7791f">TUE 3 NOV · WHAT YOU WERE TOLD</text>
  <g font-size="17" fill="#1c1a17">
    <text x="80" y="200">Host A · Starter plan · <tspan font-weight="700">$19/mo</tspan></text>
    <text x="80" y="222" font-size="13" fill="#a39d92">source [1] hosta.com/pricing</text>
    <text x="80" y="262">Host B · Pro plan · <tspan font-weight="700">$25/mo</tspan></text>
    <text x="80" y="284" font-size="13" fill="#a39d92">source [2] hostb.com/pricing</text>
    <text x="80" y="324">Host C · Basic plan · <tspan font-weight="700">$15/mo</tspan></text>
    <text x="80" y="346" font-size="13" fill="#a39d92">source [3] hostc.dev/plans</text>
  </g>

  <!-- re-check -->
  <line x1="500" y1="240" x2="772" y2="240" stroke="#1c1a17" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="500" y="150" width="276" height="70" rx="12" fill="#1c1a17"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#f4f1ea">
    <text x="516" y="176">web_search({ …,</text>
    <text x="516" y="198"><tspan fill="#f2b33d">published_after</tspan>: "2026-11-03",</text>
  </g>
  <rect x="500" y="260" width="276" height="48" rx="12" fill="#1c1a17"/>
  <text x="516" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#f4f1ea"><tspan fill="#f2b33d">fresh</tspan>: true })  // live page</text>

  <!-- now -->
  <rect x="790" y="122" width="434" height="236" rx="18" fill="#fffefb" stroke="#e8e3da" stroke-width="1.5"/>
  <text x="814" y="158" font-size="14" font-weight="700" fill="#3d5a80">WED 11 NOV · VERDICT PER FACT</text>
  <g font-size="17">
    <rect x="814" y="180" width="86" height="28" rx="14" fill="#e3f1e8"/><text x="828" y="200" font-size="14" font-weight="700" fill="#2f7d4f">✓ same</text>
    <text x="914" y="200" fill="#1c1a17">Host A Starter · $19</text>
    <rect x="814" y="242" width="86" height="28" rx="14" fill="#fbe9e4"/><text x="826" y="262" font-size="14" font-weight="700" fill="#b4442e">↑ changed</text>
    <text x="914" y="262" fill="#1c1a17">Host B Pro · $25 → <tspan font-weight="700">$29</tspan></text>
    <text x="914" y="284" font-size="13" fill="#a39d92">announced 6 Nov [4]</text>
    <rect x="814" y="304" width="86" height="28" rx="14" fill="#efebe4"/><text x="830" y="324" font-size="14" font-weight="700" fill="#6f6a61">? unclear</text>
    <text x="914" y="324" fill="#1c1a17">Host C Basic · page unreachable</text>
  </g>
  <text x="56" y="396" font-size="13" fill="#a39d92">Illustrative data. Ledger row = { subject, attribute, value, source, day }, extracted by Haiku 5.5 after each answer.</text>
</svg>
