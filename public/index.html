<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>minimi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231c1a17'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23f2b33d' stroke-width='3'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
:root {
  --bg: #f7f5f1; --panel: #fffefb; --ink: #1c1a17; --muted: #6f6a61; --faint: #a39d92; --line: #e8e3da;
  --mem: #b7791f; --mem-bg: #fdf3df; --search: #3d5a80; --search-bg: #e9eff6; --warn: #b4442e; --warn-bg: #fbe9e4;
  --user: #1c1a17; --user-ink: #fbfaf7; --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #141311; --panel: #1b1a17; --ink: #ece8e1; --muted: #a8a296; --faint: #6f6a61; --line: #2c2a26;
    --mem: #f2b33d; --mem-bg: #2e2513; --search: #9db7da; --search-bg: #1d2633; --warn: #f08a72; --warn-bg: #33201b;
    --user: #ece8e1; --user-ink: #141311; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, sans-serif; display: flex; }
button, input, textarea { font: inherit; color: inherit; }

aside { width: 272px; flex-shrink: 0; border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 18px 14px; gap: 14px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.brand b { font-size: 18px; letter-spacing: -.02em; }
.brand span { color: var(--muted); font-size: 12px; line-height: 1.3; }
.new { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 12px; cursor: pointer; text-align: left; }
.new:hover { border-color: var(--faint); }
#convs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.group { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin: 12px 8px 4px; }
.conv { border: 0; background: none; text-align: left; padding: 7px 8px; border-radius: 8px; cursor: pointer; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv:hover, .conv.on { background: var(--panel); color: var(--ink); }
.tabs { display: flex; gap: 2px; background: var(--line); padding: 3px; border-radius: 10px; }
.tabs button { flex: 1; border: 0; background: none; border-radius: 8px; padding: 5px 0; font-size: 13px; color: var(--muted); cursor: pointer; }
.tabs button.on { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
#loopCount:not(:empty) { background: var(--mem); color: var(--panel); border-radius: 999px; font-size: 11px; padding: 0 6px; margin-left: 3px; }
.panel { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
[hidden] { display: none !important; }
.item { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 10px; font-size: 13px; line-height: 1.45; }
.item b { display: block; font-weight: 600; }
.item small { color: var(--faint); display: block; margin-top: 2px; }
.item.due { border-color: var(--mem); background: var(--mem-bg); }
.item.closed { opacity: .65; }
.acts { display: flex; gap: 6px; margin-top: 8px; }
.mini { border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 2px 9px; font-size: 12px; cursor: pointer; }
.mini:hover { border-color: var(--faint); }
.fact { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.x { border: 0; background: none; color: var(--faint); cursor: pointer; font-size: 17px; line-height: 1; padding: 0 2px; }
.x:hover { color: var(--warn); }
.code { font: 11.5px/1.4 ui-monospace, Menlo, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; word-break: break-all; margin-top: 7px; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin: 10px 2px 2px; }
.note { color: var(--faint); font-size: 13px; margin: 6px 4px; }
.ping { border: 1px solid var(--mem); background: var(--mem-bg); border-radius: var(--radius); padding: 14px 16px; margin: 0 0 28px; text-align: left; }
.ping h3 { margin: 0 0 6px; font-size: 14px; color: var(--mem); }
.ping .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 4px 0; }
.ping small { color: var(--muted); }
.clock { border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; font-size: 12px; color: var(--muted); }
.clock label { display: block; margin-bottom: 6px; }
.clock input { width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 8px; }
.clock.on { border-color: var(--mem); background: var(--mem-bg); color: var(--ink); }

main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#log { flex: 1; overflow-y: auto; padding: 28px 24px 12px; }
.col { max-width: 760px; margin: 0 auto; }
.empty { text-align: center; padding-top: 12vh; }
.empty h1 { font-size: 30px; letter-spacing: -.03em; margin: 0 0 6px; font-weight: 650; }
.empty p { color: var(--muted); margin: 0 0 26px; }
.examples { display: grid; gap: 10px; text-align: left; }
.examples button { border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); padding: 12px 14px; cursor: pointer; color: var(--muted); }
.examples button:hover { color: var(--ink); border-color: var(--faint); }

.msg { margin: 0 0 26px; }
.user { display: flex; justify-content: flex-end; }
.user div { background: var(--user); color: var(--user-ink); padding: 10px 15px; border-radius: 18px 18px 4px 18px; max-width: 80%; white-space: pre-wrap; }
.trace { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip { font-size: 12.5px; border-radius: 999px; padding: 3px 10px; display: inline-flex; align-items: center; gap: 6px; max-width: 100%; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.chip.mem { color: var(--mem); background: var(--mem-bg); }
.chip.search { color: var(--search); background: var(--search-bg); }
.chip.warn { color: var(--warn); background: var(--warn-bg); }
.chip.live::before { animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.md { overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md table { border-collapse: collapse; width: 100%; font-size: 14px; margin: 12px 0; display: block; overflow-x: auto; }
.md th, .md td { border-bottom: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
.md th { color: var(--muted); font-weight: 600; }
.md code { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; font-size: 13px; }
.md a { color: inherit; }
.md sup a { text-decoration: none; font-size: 11px; color: var(--search); background: var(--search-bg); border-radius: 5px; padding: 0 5px; margin-left: 1px; }
.cursor::after { content: "▍"; animation: pulse 1s infinite; color: var(--faint); }
.sources { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; margin-top: 14px; }
.src { display: block; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 10px; text-decoration: none; color: var(--ink); font-size: 12.5px; line-height: 1.4; }
.src:hover { border-color: var(--faint); }
.src small { display: flex; gap: 6px; align-items: center; color: var(--faint); margin-bottom: 2px; }
.src img { width: 14px; height: 14px; border-radius: 3px; }
.src span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.metrics { margin-top: 10px; font-size: 12px; color: var(--faint); }
.error { color: var(--warn); }

form { padding: 12px 24px 22px; width: 100%; }
.composer { display: flex; gap: 8px; align-items: flex-end; border: 1px solid var(--line); background: var(--panel); border-radius: 18px; padding: 8px 8px 8px 16px; }
.composer:focus-within { border-color: var(--faint); }
textarea { flex: 1; border: 0; background: none; resize: none; outline: none; max-height: 200px; padding: 6px 0; }
.send { border: 0; background: var(--ink); color: var(--bg); border-radius: 12px; width: 38px; height: 38px; cursor: pointer; font-size: 18px; }
.send:disabled { opacity: .35; cursor: default; }
.hint { text-align: center; font-size: 11.5px; color: var(--faint); margin-top: 8px; }

@media (max-width: 760px) { aside { display: none; } #log { padding: 20px 16px 8px; } form { padding: 8px 16px 16px; } }
</style>
</head>
<body>
<aside>
  <div class="brand"><svg width="30" height="30" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="currentColor"/><circle cx="16" cy="16" r="6" fill="none" stroke="#f2b33d" stroke-width="3"/></svg>
    <div><b>minimi</b><br><span>remembers what it told you</span></div></div>
  <button class="new" id="new">＋ New chat</button>
  <div class="tabs" role="tablist">
    <button data-tab="convs" class="on">Chats</button>
    <button data-tab="loops">Loops<span id="loopCount"></span></button>
    <button data-tab="memory">Memory</button>
  </div>
  <nav id="convs" class="panel"></nav>
  <div id="loops" class="panel" hidden></div>
  <div id="memory" class="panel" hidden></div>
  <div class="clock" id="clockBox">
    <label for="clock">Time travel: pretend today is…</label>
    <input type="date" id="clock">
  </div>
</aside>
<main>
  <div id="log"><div class="col" id="col"></div></div>
  <form id="form" class="col">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Ask anything. I search the web and remember our past chats." autofocus></textarea>
      <button class="send" id="send" aria-label="Send">↑</button>
    </div>
    <div class="hint" id="hint"></div>
  </form>
</main>
<script>
const $ = (id) => document.getElementById(id);
const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
const store = { get: (k) => { try { return localStorage.getItem(k) } catch { return null } }, set: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k) } catch {} } };
let conversationId = null, busy = false;

const EXAMPLES = [
  'What is the cheapest managed Postgres hosting for a small SaaS right now?',
  'I need to pick a CRM for my 20-person sales team by Friday. Shortlist 5 with pricing.',
  'What did I ask you on 3 November? Is your answer still correct today?',
  'Last Tuesday I asked you about Postgres hosting. Has any pricing changed since then?',
];

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const fmtDay = (d) => new Date(d + 'T00:00:00Z').toLocaleDateString('en-GB', { timeZone: 'UTC', weekday: 'short', day: 'numeric', month: 'short' });
const realToday = () => new Date().toLocaleDateString('en-CA');
const today = () => $('clock').value || realToday();
const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, '') } catch { return u } };

// ---- clock (time travel) ----
$('clock').value = store.get('asOf') || '';
function syncClock() {
  const on = !!$('clock').value && $('clock').value !== realToday();
  $('clockBox').classList.toggle('on', on);
  $('hint').textContent = on ? `Clock set to ${fmtDay($('clock').value)}. New messages are stored on that day.` : `Today is ${fmtDay(realToday())} · memory spans all chats`;
  store.set('asOf', on ? $('clock').value : '');
  refreshSide(); showPings();
}
$('clock').onchange = syncClock;

// ---- sidebar ----
async function loadConvs() {
  const list = await fetch('/api/conversations').then((r) => r.json()).catch(() => []);
  const nav = $('convs'); nav.innerHTML = '';
  let last = '';
  for (const c of list) {
    if (c.day !== last) { last = c.day; nav.insertAdjacentHTML('beforeend', `<div class="group">${c.day === today() ? 'Today' : fmtDay(c.day)}</div>`); }
    const b = document.createElement('button');
    b.className = 'conv' + (c.id === conversationId ? ' on' : '');
    b.textContent = c.title; b.title = c.title;
    b.onclick = () => openConv(c.id);
    nav.append(b);
  }
}

async function openConv(id) {
  conversationId = id;
  const msgs = await fetch('/api/conversations/' + id).then((r) => r.json());
  $('col').innerHTML = '';
  for (const m of msgs) {
    if (m.role === 'user') addUser(m.content);
    else { const v = addBot(); v.text = m.content; v.sources = m.sources || []; v.render(true); }
  }
  loadConvs(); scroll();
}

$('new').onclick = () => { conversationId = null; showEmpty(); loadConvs(); $('input').focus(); };

// ---- tabs: chats · open loops inbox · memory you own ----
document.querySelectorAll('.tabs button').forEach((b) => (b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
  for (const id of ['convs', 'loops', 'memory']) $(id).hidden = id !== b.dataset.tab;
}));
const api = (url, opts) => fetch(url, opts).then((r) => r.json()).catch(() => null);
const followUp = (title) => send(`Follow up on my open loop: "${title}". Where does it stand now?`);
const dueText = (l) => !l.dueDay ? '' : l.dueDay < today() ? `overdue since ${fmtDay(l.dueDay)}` : l.dueDay === today() ? 'due today' : `due ${fmtDay(l.dueDay)}`;
let loopsById = new Map();

async function loadLoops() {
  const loops = (await api('/api/loops')) || [];
  loopsById = new Map(loops.map((l) => [l.id, l]));
  const open = loops.filter((l) => l.status === 'open'), closed = loops.filter((l) => l.status === 'closed');
  $('loopCount').textContent = open.length || '';
  $('loops').innerHTML = (open.length ? '' : '<p class="note">No open loops. Mention a decision or a follow-up and minimi keeps track of it here.</p>')
    + open.map((l) => `<div class="item ${l.dueDay && l.dueDay <= today() ? 'due' : ''}"><b>${esc(l.title)}</b>
        <small>opened ${fmtDay(l.openedDay)}${l.dueDay ? ' · ' + dueText(l) : ''}</small>
        <div class="acts"><button class="mini" data-follow="${l.id}">Check now</button><button class="mini" data-done="${l.id}">Done</button></div></div>`).join('')
    + (closed.length ? '<div class="label">Closed · decisions traced</div>' + closed.slice(0, 15).map((l) =>
        `<div class="item closed"><b>${esc(l.title)}</b><small>✓ ${esc(l.decision || '')} · ${fmtDay(l.closedDay)}</small></div>`).join('') : '');
}
$('loops').onclick = async (e) => {
  const { follow, done } = e.target.dataset;
  if (follow) followUp(loopsById.get(+follow).title);
  if (done) { await api(`/api/loops/${done}/close`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ asOf: today() }) }); refreshSide(); showPings(); }
};

async function loadMemory() {
  const facts = (await api('/api/profile')) || [];
  const url = location.origin + '/mcp', cmd = `claude mcp add --transport http minimi ${url}`;
  $('memory').innerHTML = '<div class="label">What minimi knows about you</div>'
    + (facts.length ? facts.map((f) => `<div class="item fact"><div><b>${esc(f.value)}</b><small>${esc(f.key)} · since ${fmtDay(f.day)}</small></div>
        <button class="x" title="Forget this" data-forget="${esc(f.key)}">×</button></div>`).join('')
      : '<p class="note">Nothing yet. Mention your team, stack or city once and minimi won\'t ask again.</p>')
    + `<div class="label">Memory MCP</div><div class="item"><b>Plug this memory into any AI</b>
        <small>Claude, ChatGPT, Cursor… Read-only, localhost only.</small>
        <div class="code">${esc(cmd)}</div>
        <div class="acts"><button class="mini" data-copy="${esc(url)}">Copy link</button><button class="mini" data-copy="${esc(cmd)}">Copy command</button></div></div>`;
}
$('memory').onclick = async (e) => {
  const { forget, copy } = e.target.dataset;
  if (forget) { await api('/api/profile/' + encodeURIComponent(forget), { method: 'DELETE' }); loadMemory(); }
  if (copy) { try { await navigator.clipboard.writeText(copy); e.target.textContent = 'Copied ✓'; } catch {} }
};

// ---- pings: due loops surface on their own when you open minimi ----
async function showPings() {
  const due = (await api('/api/pings?today=' + today())) || [];
  document.title = due.length ? `(${due.length}) minimi` : 'minimi';
  const empty = $('col').querySelector('.empty');
  $('col').querySelector('.ping')?.remove();
  if (!due.length || !empty) return;
  const card = document.createElement('div');
  card.className = 'ping';
  card.innerHTML = `<h3>🐾 minimi pinged you · ${due.length} open loop${due.length > 1 ? 's' : ''} need${due.length > 1 ? '' : 's'} you</h3>`
    + due.map((l) => `<div class="row"><span>${esc(l.title)} <small>· ${dueText(l)}</small></span><button class="mini" data-follow="${l.id}">Check now</button></div>`).join('');
  card.onclick = (e) => { const id = e.target.dataset.follow; if (id) followUp(due.find((l) => l.id === +id).title); };
  empty.prepend(card);
}
const refreshSide = () => { loadConvs(); loadLoops(); loadMemory(); };

function showEmpty() {
  $('col').innerHTML = `<div class="empty"><h1>Ask, then ask again next week.</h1>
    <p>Live web search, plus memory of every past chat, with dates.</p>
    <div class="examples">${EXAMPLES.map((e) => `<button>${esc(e)}</button>`).join('')}</div></div>`;
  $('col').querySelectorAll('.examples button').forEach((b) => (b.onclick = () => send(b.textContent)));
  showPings();
}

// ---- messages ----
function addUser(text) {
  $('col').querySelector('.empty')?.remove();
  $('col').insertAdjacentHTML('beforeend', `<div class="msg user"><div>${esc(text)}</div></div>`);
}

function addBot() {
  const el = document.createElement('div');
  el.className = 'msg bot';
  el.innerHTML = '<div class="trace"></div><div class="md"></div><div class="sources"></div><div class="metrics"></div>';
  $('col').append(el);
  const view = {
    text: '', sources: [], el,
    chip(cls, text) { const c = document.createElement('span'); c.className = 'chip ' + cls; c.textContent = text; el.querySelector('.trace').append(c); return c; },
    render(final) {
      const byN = new Map(view.sources.map((s) => [s.n, s]));
      const linked = view.text.replace(/\[(\d+)\](?!\()/g, (m, n) => byN.has(+n) ? `<sup><a href="${esc(byN.get(+n).url)}" target="_blank" rel="noopener">${n}</a></sup>` : m);
      const md = el.querySelector('.md');
      md.innerHTML = DOMPurify.sanitize(marked.parse(linked), { ADD_ATTR: ['target'] });
      md.classList.toggle('cursor', !final);
      if (final) {
        const cited = view.sources.filter((s) => view.text.includes(`[${s.n}]`));
        el.querySelector('.sources').innerHTML = cited.map((s) => `<a class="src" href="${esc(s.url)}" target="_blank" rel="noopener">
          <small><img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(host(s.url))}&sz=32" alt="">${s.n} · ${esc(host(s.url))}${s.published ? ' · ' + fmtDay(s.published) : ''}</small>
          <span>${esc(s.title)}</span></a>`).join('');
      }
    },
  };
  return view;
}

const scroll = () => { const l = $('log'); l.scrollTop = l.scrollHeight; };

// ---- send + stream ----
async function send(text) {
  text = text.trim();
  if (!text || busy) return;
  busy = true; $('send').disabled = true; $('input').value = ''; autosize();
  addUser(text);
  const view = addBot(); view.render(false); scroll();
  let searching = null, raf = 0;
  const paint = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { view.render(false); scroll(); }); };

  try {
    const res = await fetch('/api/chat', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ message: text, conversationId, tz, asOf: $('clock').value && $('clock').value !== realToday() ? $('clock').value : undefined }) });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const block = buf.slice(0, i); buf = buf.slice(i + 2);
        const data = block.split('\n').filter((l) => l.startsWith('data:')).map((l) => l.slice(5).trimStart()).join('\n');
        if (!data) continue;
        const e = JSON.parse(data);
        if (e.type === 'meta') {
          conversationId = e.conversationId;
          for (const r of e.recalled) view.chip('mem', `Remembered ${fmtDay(r.day)} · ${r.title}`);
          for (const n of e.notes) view.chip('warn', n);
        } else if (e.type === 'status') {
          searching?.classList.remove('live');
          searching = view.chip('search live', e.text);
        } else if (e.type === 'sources') {
          view.sources.push(...e.sources);
        } else if (e.type === 'text') {
          searching?.classList.remove('live'); searching = null;
          view.text += e.text; paint();
        } else if (e.type === 'done') {
          const s = (ms) => (ms / 1000).toFixed(1) + 's';
          view.el.querySelector('.metrics').textContent =
            [e.firstTokenMs != null && `first words ${s(e.firstTokenMs)}`, `${e.searches} search${e.searches === 1 ? '' : 'es'}`, `done ${s(e.ms)}`].filter(Boolean).join(' · ');
        } else if (e.type === 'error') {
          throw new Error(e.message);
        }
      }
    }
  } catch (err) {
    view.el.querySelector('.md').insertAdjacentHTML('beforeend', `<p class="error">${esc(err.message)}</p>`);
  } finally {
    cancelAnimationFrame(raf);
    view.el.querySelectorAll('.live').forEach((c) => c.classList.remove('live'));
    view.render(true); scroll();
    busy = false; $('send').disabled = false; $('input').focus();
    loadConvs();
    // facts, profile and loops are filed in the background after each reply
    setTimeout(refreshSide, 5000); setTimeout(refreshSide, 12000);
  }
}

function autosize() { const t = $('input'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 200) + 'px'; }
$('input').oninput = autosize;
$('input').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send($('input').value); } };
$('form').onsubmit = (e) => { e.preventDefault(); send($('input').value); };

showEmpty(); syncClock();
fetch('/api/health').then((r) => r.json()).then((h) => { if (!h.ok) $('hint').textContent = `Missing ${h.missing.join(', ')}: copy .env.example to .env`; });
</script>
</body>
</html>
